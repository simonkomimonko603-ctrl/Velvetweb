<!DOCTYPE html>
<html lang="sk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakty | Velvet Nights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        velvetDark: '#2C221E',
                        velvetBeige: '#D8CEC4',
                        velvetLight: '#F4EFE6',
                        velvetGold: '#C5A880',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-velvetBeige text-velvetDark antialiased selection:bg-velvetGold selection:text-white relative">

    <header class="absolute top-0 left-0 right-0 z-50 px-6 py-6 border-b border-white/10">
        <div class="max-w-7xl mx-auto grid grid-cols-3 items-center">
            <div class="flex justify-start">
                <a href="index.html" class="flex items-center space-x-2 text-white uppercase tracking-widest text-xs font-semibold hover:text-velvetGold transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span>Domov</span>
                </a>
            </div>
            <div class="text-center">
                <a href="index.html" class="font-serif text-2xl md:text-3xl tracking-[0.25em] text-white font-bold inline-block">VELVET NIGHTS</a>
                <div class="text-[10px] tracking-[0.3em] text-white/60 uppercase">Luxury Hotel & Spa</div>
            </div>
            <div class="flex justify-end">
                <a href="kontakty.html" class="bg-white/10 hover:bg-white/20 text-white text-xs uppercase tracking-widest px-5 py-2.5 rounded-full backdrop-blur-md transition border border-white/20">
                    Kontakt
                </a>
            </div>
        </div>
    </header>

    <section class="relative h-[70vh] flex items-center justify-center text-center bg-cover bg-center" style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&q=80&w=2000');">
        <div class="max-w-4xl mx-auto px-6 text-white pt-20">
            <h1 class="font-serif text-5xl md:text-7xl font-normal mb-6 tracking-wide">Kontaktujte nás</h1>
            <p class="text-lg md:text-xl font-light max-w-2xl mx-auto text-gray-200">Sme tu pre vás 24 hodín denne, 7 dní v týždni.</p>
        </div>
    </section>

    <section class="py-24 px-6 max-w-4xl mx-auto">
        <div class="bg-white p-10 md:p-14 rounded-3xl shadow-xl">
            <h2 class="font-serif text-3xl mb-6 text-velvetDark text-center">Napíšte nám správu</h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-600 mb-2">Vaše meno</label>
                    <input type="text" placeholder="Ján Mrkvicka" class="w-full bg-gray-100 border-none rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-velvetGold">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-600 mb-2">E-mailová adresa</label>
                    <input type="email" placeholder="jan@example.com" class="w-full bg-gray-100 border-none rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-velvetGold">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-600 mb-2">Správa</label>
                    <textarea rows="4" placeholder="Dobrý deň, mal by som záujem o pobyt..." class="w-full bg-gray-100 border-none rounded-xl p-4 text-sm outline-none focus:ring-2 focus:ring-velvetGold"></textarea>
                </div>
                <button onclick="alert('Ďakujeme za správu, recepcia Vás bude čoskoro kontaktovať!')" class="w-full bg-velvetDark text-white hover:bg-velvetGold transition py-4 rounded-xl text-xs uppercase tracking-widest font-semibold shadow-lg">Odoslať správu</button>
            </div>
        </div>
    </section>

    <footer class="bg-velvetDark text-white py-16 px-6 text-center border-t border-white/10">
        <p class="text-xs text-gray-500">&copy; 2026 Velvet Nights. Všetky práva vyhradené.</p>
    </footer>

    <!-- AI CHATBOT WIDGET -->
    <div class="fixed bottom-8 right-8 z-50">
        <button id="chat-toggle" onclick="toggleChat()" class="bg-velvetGold text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-105 transition transform focus:outline-none border-2 border-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
        </button>
        <div id="chat-window" class="hidden absolute bottom-20 right-0 w-80 md:w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 overflow-hidden flex flex-col transition-all">
            <div class="bg-velvetDark text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="font-serif text-sm font-semibold tracking-wider">Velvet AI Asistent</span>
                </div>
                <button onclick="toggleChat()" class="text-gray-400 hover:text-white text-lg">&times;</button>
            </div>
            <div id="chat-messages" class="p-4 h-80 overflow-y-auto space-y-3 text-sm bg-[#F4EFE6]/50 text-velvetDark">
                <div class="bg-white p-3 rounded-xl shadow-sm max-w-[85%] text-velvetDark">Dobrý deň! Sme tu pre vás na recepcii. S čím vám môžeme pomôcť?</div>
            </div>
            <div class="p-3 bg-white border-t border-gray-100 flex items-center space-x-2">
                <input type="text" id="chat-input" placeholder="Napíšte správu..." class="flex-1 bg-gray-100 border-none rounded-xl px-4 py-2.5 text-xs focus:ring-2 focus:ring-velvetGold outline-none text-velvetDark" onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" class="bg-velvetDark text-white px-4 py-2.5 rounded-xl text-xs uppercase font-semibold hover:bg-velvetGold transition">Odoslať</button>
            </div>
        </div>
    </div>
    <script>
        function toggleChat() { document.getElementById('chat-window').classList.toggle('hidden'); }
        function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const container = document.getElementById('chat-messages');
            const text = input.value.trim();
            if (!text) return;
            container.innerHTML += `<div class="bg-velvetDark text-white p-3 rounded-xl shadow-sm max-w-[85%] ml-auto text-right">${text}</div>`;
            input.value = '';
            container.scrollTop = container.scrollHeight;
            setTimeout(() => {
                let reply = "Recepcia hotela je dostupná na tel. čísle +421 900 123 456 alebo e-mailom info@velvetnights.sk.";
                container.innerHTML += `<div class="bg-white p-3 rounded-xl shadow-sm max-w-[85%] text-velvetDark">${reply}</div>`;
                container.scrollTop = container.scrollHeight;
            }, 800);
        }
    </script>
</body>
</html>
